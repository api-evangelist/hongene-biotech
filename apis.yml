aid: hongene-biotech
name: Hongene Biotech
description: 'Hongene Biotech Corporation is a nucleic acid contract development and
  manufacturing organization (CDMO) founded in 1998, with nearly 30 years of RNA-focused
  expertise. It offers vertically integrated services spanning oligonucleotide API
  manufacturing (from preclinical to commercial, GMP up to tonne scale), mRNA CDMO
  services (raw materials through enzymes and lipids to GMP manufacture and fill-finish),
  custom chemical synthesis of nucleic acid building blocks, and chemoenzymatic ligation
  for siRNA and sgRNA. Hongene supplies premium nucleic acid raw materials worldwide
  and runs an online store for direct-purchase reagents. This profile was surfaced
  as a portfolio company of Hongshan and enriched from Hongene public web surfaces;
  the company publishes no developer API.'
